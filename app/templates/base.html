<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}заметки, которыми делятся{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <script>
        window.API_BASE = "{{ api_base|default('/api') }}";
    </script>
</head>
<body>
<header class="site-header">
    <a class="brand" href="/" aria-label="на главную">
        <span>Главная</span>
    </a>
    <nav class="site-nav" aria-label="Основная навигация">
        <a href="/">Лента</a>
        {% if request.session.get('user_id') %}
            <a href="/profile">Профиль</a>
            <a class="nav-logout" href="/logout">Выйти</a>
        {% else %}
            <a class="nav-login" href="/login">Войти</a>
        {% endif %}
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer class="site-footer"><span>© 2026</span><span>Место для хороших мыслей</span></footer>
</body>
</html>
